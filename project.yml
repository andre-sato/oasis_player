name: OasisPlayer
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  OasisPlayer:
    type: application
    platform: iOS
    sources: [OasisPlayer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andresato.oasisplayer
        INFOPLIST_FILE: OasisPlayer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: OasisPlayer/Resources/OasisPlayer.entitlements
    dependencies: []
  OasisPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OasisPlayerTests]
    dependencies: [target: OasisPlayer]
